workflows:
  android-signed-release:
    name: My ID Portal Print - Signed APK
    max_build_duration: 60
    environment:
      flutter: 3.44.4
      java: 17
      android_signing:
        - paliaapk-release
      vars:
        PACKAGE_NAME: com.shanpalia.my_id_portal_print

    scripts:
      - name: Generate Android project
        script: |
          set -e
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.shanpalia --project-name my_id_portal_print .
          fi

      - name: Prepare app icon asset
        script: |
          set -e
          test -f assets/app_icon.svg
          mkdir -p assets
          convert -background none assets/app_icon.svg -resize 512x512 assets/app_icon.png
          test -s assets/app_icon.png

      - name: Configure Android branding
        script: |
          set -e
          mkdir -p android/app/src/main/res/drawable-nodpi android/app/src/main/res/drawable android/app/src/main/res/values android/app/src/main/res/values-v31
          cp assets/app_icon.png android/app/src/main/res/drawable-nodpi/ic_app_icon.png
          cat > android/app/src/main/res/drawable/launch_background.xml <<'EOF'
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:drawable="@android:color/white" />
              <item android:gravity="center" android:width="180dp" android:height="180dp">
                  <bitmap android:src="@drawable/ic_app_icon" android:gravity="fill" />
              </item>
          </layer-list>
          EOF
          cat > android/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="LaunchTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:windowNoTitle">true</item>
                  <item name="android:windowLightStatusBar">true</item>
                  <item name="android:statusBarColor">#FFFFFF</item>
                  <item name="android:navigationBarColor">#FFFFFF</item>
                  <item name="android:windowBackground">@drawable/launch_background</item>
              </style>
              <style name="NormalTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:windowLightStatusBar">true</item>
                  <item name="android:statusBarColor">#F7FAFF</item>
                  <item name="android:navigationBarColor">#F7FAFF</item>
                  <item name="android:windowBackground">#F7FAFF</item>
              </style>
          </resources>
          EOF
          cat > android/app/src/main/res/values-v31/styles.xml <<'EOF'
          <resources>
              <style name="LaunchTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:windowSplashScreenBackground">#FFFFFF</item>
                  <item name="android:windowSplashScreenAnimatedIcon">@drawable/ic_app_icon</item>
                  <item name="android:windowLightStatusBar">true</item>
                  <item name="android:statusBarColor">#FFFFFF</item>
                  <item name="android:navigationBarColor">#FFFFFF</item>
              </style>
              <style name="NormalTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:windowLightStatusBar">true</item>
                  <item name="android:statusBarColor">#F7FAFF</item>
                  <item name="android:navigationBarColor">#F7FAFF</item>
                  <item name="android:windowBackground">#F7FAFF</item>
              </style>
          </resources>
          EOF
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          s = s.replace('android:icon="@mipmap/ic_launcher"', 'android:icon="@drawable/ic_app_icon"')
          s = s.replace('android:label="my_id_portal_print"', 'android:label="My ID Portal Print"')
          p.write_text(s)
          PY

      - name: Get Flutter packages
        script: |
          set -e
          flutter pub get

      - name: Ensure document tile widget exists
        script: |
          set -e
          if ! grep -q "class _DocTile" lib/main.dart; then
            cat >> lib/main.dart <<'DART'

          class _DocTile extends StatelessWidget {
            final IconData icon;
            final String label;
            final VoidCallback onTap;

            const _DocTile(this.icon, this.label, this.onTap, {super.key});

            @override
            Widget build(BuildContext context) {
              return Material(
                color: Colors.transparent,
                child: InkWell(
                  onTap: onTap,
                  borderRadius: BorderRadius.circular(16),
                  child: Ink(
                    decoration: BoxDecoration(
                      color: Colors.white,
                      borderRadius: BorderRadius.circular(16),
                      border: Border.all(color: const Color(0xFFE4EAF3)),
                    ),
                    child: Column(
                      mainAxisAlignment: MainAxisAlignment.center,
                      children: [
                        Icon(icon, color: const Color(0xFF1479FF), size: 30),
                        const SizedBox(height: 7),
                        Text(
                          label,
                          textAlign: TextAlign.center,
                          maxLines: 2,
                          overflow: TextOverflow.ellipsis,
                          style: const TextStyle(fontSize: 11, fontWeight: FontWeight.w700),
                        ),
                      ],
                    ),
                  ),
                ),
              );
            }
          }
          DART
          fi
          echo "Document tile widget check complete."

      - name: Configure Codemagic signing
        script: |
          set -e
          test -n "$CM_KEYSTORE_PATH"
          test -n "$CM_KEYSTORE_PASSWORD"
          test -n "$CM_KEY_ALIAS"
          test -n "$CM_KEY_PASSWORD"
          cat > android/key.properties <<EOF
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=$CM_KEYSTORE_PATH
          EOF
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('android/app/build.gradle.kts')
          s = p.read_text()
          header = '''import java.util.Properties
          import java.io.FileInputStream

          val keystoreProperties = Properties()
          val keystorePropertiesFile = rootProject.file("key.properties")
          if (keystorePropertiesFile.exists()) {
              FileInputStream(keystorePropertiesFile).use { keystoreProperties.load(it) }
          }

          '''
          if 'val keystorePropertiesFile' not in s:
              s = header + s
          signing = '''    signingConfigs {
              create("release") {
                  keyAlias = keystoreProperties["keyAlias"] as String
                  keyPassword = keystoreProperties["keyPassword"] as String
                  storeFile = file(keystoreProperties["storeFile"] as String)
                  storePassword = keystoreProperties["storePassword"] as String
              }
          }

          '''
          if 'create("release")' not in s:
              marker = '    buildTypes {'
              if marker not in s:
                  raise SystemExit('Could not locate buildTypes in android/app/build.gradle.kts')
              s = s.replace(marker, signing + marker, 1)
          release_sign = 'signingConfig = signingConfigs.getByName("release")'
          if release_sign not in s:
              patterns = [r'(getByName\("release"\)\s*\{)', r'(release\s*\{)']
              for pattern in patterns:
                  m = re.search(pattern, s)
                  if m:
                      pos = m.end()
                      s = s[:pos] + '\n            ' + release_sign + s[pos:]
                      break
              else:
                  m = re.search(r'buildTypes\s*\{', s)
                  if not m:
                      raise SystemExit('Could not locate buildTypes in android/app/build.gradle.kts')
                  pos = m.end()
                  s = s[:pos] + '\n        release {\n            ' + release_sign + '\n        }' + s[pos:]
          p.write_text(s)
          PY
          echo "Codemagic release signing configuration prepared."

      - name: Build signed release APK
        script: |
          set -e
          flutter clean
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter build apk --release --no-tree-shake-icons

      - name: Verify signed APK
        script: |
          set -e
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -f "$APK"
          ls -lh "$APK"
          echo "My ID Portal Print signed APK created successfully."

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk

    publishing:
      email:
        recipients:
          - shanpalia786@gmail.com
        notify:
          success: true
          failure: true
