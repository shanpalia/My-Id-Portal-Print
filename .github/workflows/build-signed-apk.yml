name: Build Signed APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.4'
          cache: true

      - name: Generate Android project
        run: flutter create . --platforms=android --project-name my_id_portal_print

      - name: Flutter pub get
        run: flutter pub get

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "KEYSTORE_BASE64 GitHub secret is missing."
            exit 1
          fi
          mkdir -p android/app
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks

      - name: Create key.properties
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$STORE_PASSWORD" || (echo "STORE_PASSWORD secret is missing." && exit 1)
          test -n "$KEY_ALIAS" || (echo "KEY_ALIAS secret is missing." && exit 1)
          test -n "$KEY_PASSWORD" || (echo "KEY_PASSWORD secret is missing." && exit 1)
          cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Configure release signing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle.kts')
          s = p.read_text()
          imports = '''import java.util.Properties\nimport java.io.FileInputStream\n\nval keystoreProperties = Properties()\nval keystorePropertiesFile = rootProject.file("key.properties")\nif (keystorePropertiesFile.exists()) {\n    FileInputStream(keystorePropertiesFile).use { keystoreProperties.load(it) }\n}\n\n'''
          if 'val keystorePropertiesFile' not in s:
              s = imports + s
          signing = '''signingConfigs {\n        create("release") {\n            keyAlias = keystoreProperties["keyAlias"] as String\n            keyPassword = keystoreProperties["keyPassword"] as String\n            storeFile = file(keystoreProperties["storeFile"] as String)\n            storePassword = keystoreProperties["storePassword"] as String\n        }\n    }\n\n    '''
          if 'create("release")' not in s:
              s = s.replace('    buildTypes {', '    ' + signing + 'buildTypes {', 1)
          old = 'signingConfig = signingConfigs.getByName("debug")'
          if old in s:
              s = s.replace(old, 'signingConfig = signingConfigs.getByName("release")')
          elif 'signingConfig = signingConfigs.getByName("release")' not in s:
              s = s.replace('release {', 'release {\n            signingConfig = signingConfigs.getByName("release")', 1)
          p.write_text(s)
          PY

      - name: Verify Android signing configuration
        run: |
          test -f android/app/upload-keystore.jks
          grep -q 'signingConfigs.getByName("release")' android/app/build.gradle.kts

      - name: Build signed release APK
        run: flutter build apk --release

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: my-id-portal-print-signed-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
